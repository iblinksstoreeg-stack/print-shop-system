<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة أوردرات المطبعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f4f0;--card:#ffffff;--ink:#1c1c20;--muted:#6c6c78;--line:#e3e1da;--col:#ecebe5;
  --brand:#0f6b5c;--brand-ink:#ffffff;--soft:#e6f1ee;--warn:#b45309;--warn-bg:#fdf1de;
  --bad:#b91c1c;--bad-bg:#fde8e8;--ok:#15803d;--ok-bg:#e3f4e8;--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a;--card:#202226;--ink:#ececf1;--muted:#9a9aa8;--line:#33353b;--col:#1b1c20;
    --brand:#34b39d;--brand-ink:#08201b;--soft:#1d3531;--warn:#f0a24b;--warn-bg:#3a2d17;
    --bad:#f08080;--bad-bg:#3b1f1f;--ok:#5fd18a;--ok-bg:#1b3325;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a;--card:#202226;--ink:#ececf1;--muted:#9a9aa8;--line:#33353b;--col:#1b1c20;
  --brand:#34b39d;--brand-ink:#08201b;--soft:#1d3531;--warn:#f0a24b;--warn-bg:#3a2d17;
  --bad:#f08080;--bad-bg:#3b1f1f;--ok:#5fd18a;--ok-bg:#1b3325;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:19px;margin:0;flex:1 1 auto;min-width:160px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1 1 220px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.stat .s{color:var(--muted);font-size:12px}
.stat.bad .n{color:var(--bad)}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.col{flex:0 0 268px;background:var(--col);border-radius:13px;padding:10px;min-height:120px}
.col h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.col h3 small{color:var(--muted);font-weight:400}
.cnt{background:var(--card);border-radius:20px;padding:0 9px;font-size:12px;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--sc,var(--brand));border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:var(--brand)}
.card .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .code{font-weight:700;font-size:13px;color:var(--muted)}
.card .nm{font-weight:600}
.card .sm{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;margin:4px 0 0 4px;background:var(--soft);color:var(--brand);font-weight:600}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:14px 4px}
table.lst{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
.lstwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.lst th,table.lst td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
table.lst th{background:var(--col);font-size:13px}
table.lst tr.row{cursor:pointer}
table.lst tr.row:hover td{background:var(--soft)}
details.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:14px}
details.rep summary{cursor:pointer;font-weight:600}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}
.hb>span{flex:0 0 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bt{flex:1;background:var(--col);border-radius:6px;height:12px;overflow:hidden}
.hb .bt i{display:block;height:100%;background:var(--brand)}
.hb>b{flex:0 0 110px;text-align:end;font-weight:600}
.trend{display:flex;gap:10px;align-items:flex-end}
.tcol{flex:1;text-align:center}
.tbars{height:140px;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.tbars i{display:block;width:40%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.tbars i.r{background:var(--brand)}.tbars i.c{background:var(--warn)}
.tl{font-size:12px;color:var(--muted)}.tn{font-size:12.5px;font-weight:700}
.tn.pos{color:var(--ok)}.tn.neg{color:var(--bad)}
.stat.ok .n{color:var(--ok)}
.frow{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:7px 0;flex-wrap:wrap}
.frow img.th{width:54px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.frow .fi{flex:1 1 180px;min-width:0}.frow .fi b{word-break:break-all}
.pgrow{display:grid;grid-template-columns:56px 1fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:8px}
.pgrow input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.lg{width:56px;height:56px;border:1px dashed var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
@media(max-width:600px){.pgrow{grid-template-columns:56px 1fr 1fr}.pgrow .pg-phone{grid-column:2/-1}}
.strow{display:grid;grid-template-columns:1fr 130px auto auto;gap:6px;align-items:center;margin-bottom:8px}
.strow input.st-label,.strow select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%;min-width:0}
@media(max-width:600px){.strow{grid-template-columns:1fr 1fr}.strow>div{grid-column:1/-1}}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lgrid .card{margin-bottom:0}
a.btn{text-decoration:none;display:inline-block;color:inherit}
.irow select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.rrow{grid-template-columns:2fr 1fr 90px 110px 34px}
.mrow{grid-template-columns:1.2fr 2fr 90px 130px 34px}
.lowrow td{background:var(--warn-bg)}
@media(max-width:600px){.irow .r-name,.irow .m-item,.irow .m-name{grid-column:1/-1}.rrow,.mrow{grid-template-columns:1fr 1fr}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px))}
#modal.on{display:block}
.mbox{background:var(--bg);border-radius:14px;max-width:860px;margin:0 auto;padding:16px 18px 20px;border:1px solid var(--line)}
.mhead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.mhead h2{margin:0;font-size:18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:11px}
.sec h4{margin:0 0 7px;font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv span:first-child{color:var(--muted)}
.track{display:flex;gap:2px;overflow-x:auto;margin-bottom:11px;padding-bottom:4px}
.tk{flex:1 0 74px;text-align:center;font-size:11.5px;color:var(--muted)}
.tk i{display:block;height:6px;border-radius:4px;background:var(--line);margin-bottom:4px}
.tk.done i{background:var(--brand)}
.tk.cur i{background:var(--warn)}
.tk.cur{color:var(--ink);font-weight:700}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label.f>input,label.f>select,label.f>textarea,.inp{display:block;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:3px}
textarea{min-height:64px;resize:vertical}
.irow{display:grid;grid-template-columns:2fr 2fr 80px 100px 34px;gap:6px;margin-bottom:6px}
.irow input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.irow .x{border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--bad)}
@media(max-width:600px){.irow{grid-template-columns:1fr 1fr;border:1px solid var(--line);padding:6px;border-radius:9px}.irow .i-desc,.irow .i-specs{grid-column:1/-1}}
.hist{max-height:200px;overflow:auto;font-size:13px}
.hist div{padding:3px 0;border-bottom:1px dashed var(--line)}
.hist small{color:var(--muted)}
.stagebox{border:2px solid var(--brand);background:var(--soft)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.chk input{margin-top:5px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note-ok{color:var(--ok);font-weight:600}
.items-t{width:100%;border-collapse:collapse;font-size:14px}
.items-t th,.items-t td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start}
.items-t th{color:var(--muted);font-weight:600;font-size:12.5px}
.tot{font-weight:700}
/* toast + dialog */
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:99;pointer-events:none}
#toast div{background:#222;color:#fff;padding:9px 16px;border-radius:10px;max-width:90%;font-size:14px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.dbox{background:var(--card);border-radius:13px;padding:18px;max-width:420px;width:100%}
.dbox .btns{display:flex;gap:8px;justify-content:flex-end}
/* documents overlay */
#docOverlay{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;display:none;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 20px}
#docOverlay.on{display:block}
#docOverlay .bar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
.sheet{max-width:820px;margin:0 auto}
@media print{
  html,body{background:#fff!important}
  body>*:not(#docOverlay){display:none!important}
  #docOverlay{position:static;display:block!important;padding:0;overflow:visible}
  #docOverlay .bar{display:none!important}
  .sheet{box-shadow:none!important;border:0!important;max-width:none!important}
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1 id="ttl">🖨️ إدارة الأوردرات</h1>
    <button class="btn" data-act="user" id="userBtn">👤 الموظف</button>
    <button class="btn" data-act="staff" id="staffBtn" style="display:none">👥 الموظفين</button>
    <button class="btn" data-act="settings" id="setBtn">⚙️ الإعدادات</button>
    <button class="btn" data-act="export" id="expBtn" style="display:none">⬇️ تصدير CSV</button>
    <button class="btn pri" data-act="new" id="newBtn">+ أوردر جديد</button>
  </header>
  <div id="banner"></div>
  <div id="tabs" class="tabs"></div>
  <div id="stats" class="stats"></div>
  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="ابحث بالكود أو اسم العميل أو الموبايل…">
    <div class="seg" id="segv">
      <button data-act="view" data-v="board" id="vb" class="on">لوحة المتابعة</button>
      <button data-act="view" data-v="list" id="vl">قائمة الأوردرات</button>
    </div>
  </div>
  <div id="main"></div>
</div>
<div id="modal"></div>
<div id="docOverlay"></div>
<div id="toast"></div>

<script>
/* ============ ثوابت ============ */
const STAGES=[
  {k:'new',t:'طلب جديد',c:'#6b7280'},
  {k:'proof',t:'بروفة قيد التصميم',c:'#7c3aed'},
  {k:'review',t:'البروفة عند العميل',c:'#2563eb'},
  {k:'deposit',t:'منتظر العربون',c:'#d97706'},
  {k:'production',t:'تحت التنفيذ',c:'#0f6b5c'},
  {k:'ready',t:'جاهز للتسليم',c:'#0891b2'},
  {k:'done',t:'تم التسليم',c:'#15803d'}
];
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const METHODS=['انستاباي','فودافون كاش','تحويل بنكي','نقدًا'];
const DEFAULTS={company:'اسم المطبعة',phone:'',address:'',logo:'',pages:'صفحة فيس بوك 1، صفحة فيس بوك 2',designers:'مصمم 1، مصمم 2',depositPct:50,
  payInfo:'انستاباي / فودافون كاش: 01xxxxxxxxx',
  terms:'الفاتورة مبدئية وتصبح نهائية بعد استلام العربون وتأكيده. لا يبدأ التنفيذ قبل تأكيد التحويل. الأوردرات المخصصة لا تُسترد بعد بدء الطباعة.'};
const SHEET_CSS=`
.sheet{background:#fff;color:#111;border:1px solid #ddd;padding:26px 30px;font-family:'Cairo',Tahoma,sans-serif;direction:rtl;font-size:14px;line-height:1.6}
.sheet h1{margin:0;font-size:22px}.sheet .logo{height:64px;max-width:150px;object-fit:contain}.sheet .sub{color:#555;font-size:13px}
.sheet .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0f6b5c;padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.sheet .ttl{background:#0f6b5c;color:#fff;display:inline-block;padding:3px 14px;border-radius:6px;font-weight:700}
.sheet table{width:100%;border-collapse:collapse;margin:10px 0}
.sheet th,.sheet td{border:1px solid #bbb;padding:6px 8px;text-align:right;vertical-align:top}
.sheet th{background:#eef3f2}
.sheet .box{border:1px solid #bbb;border-radius:6px;padding:8px 12px;margin:8px 0}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.sheet .tot td{font-weight:700;background:#f6f6f6}
.sheet .sign{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px;text-align:center;font-size:13px}
.sheet .sign div{border-top:1px solid #555;padding-top:4px}
.sheet .ck{display:inline-block;width:13px;height:13px;border:1px solid #333;margin-left:6px;vertical-align:middle}
.sheet .foot{font-size:12px;color:#444;margin-top:12px}
`;
const st=document.createElement('style');st.textContent=SHEET_CSS;document.head.appendChild(st);

/* ============ حالة التطبيق ============ */
let orders=[],settings={...DEFAULTS,pagesData:[]},mode='shared';
const ui={view:'board',tab:'orders',period:'thisMonth',q:'',modal:null,shownAt:0,pReturn:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US')+' ج.م';
const fmt=ts=>ts?new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const fmtD=ts=>ts?new Date(ts).toLocaleDateString('en-GB'):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const list=s=>String(s||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let curUser='';
function toast(m){const t=$('#toast');t.innerHTML='<div>'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',3200)}
function ask(msg,ok='تأكيد'){return new Promise(res=>{const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dbox"><p>${esc(msg)}</p><div class="btns"><button class="btn" data-v="0">إلغاء</button><button class="btn pri" data-v="1">${esc(ok)}</button></div></div>`;
  d.addEventListener('click',e=>{const b=e.target.closest('button');if(b){d.remove();res(b.dataset.v==='1')}});document.body.appendChild(d)})}


/* ============ الاتصال بالخادم (Google Apps Script) ============ */
const dl={save:async({filename,data})=>{
  const type=/\.html$/.test(filename)?'text/html;charset=utf-8':/\.csv$/.test(filename)?'text/csv;charset=utf-8':'text/plain;charset=utf-8';
  const b=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(b),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}};
let token=lsGet('po_token',''),me=null,serverVer=null,designersSrv=[],staffSrv=[],booting=true,loginErr='',inflight=0;
const dirty=new Set(),chains={};
function call(m,a){
  return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,m,a:a||{}})})
    .then(r=>r.json())
    .then(r=>{if(r&&r.ok)return r.data;throw new Error((r&&r.err)||'خطأ غير معروف')})
    .catch(e=>{
      if(e.message==='AUTH')doLogout(true);
      throw (e instanceof TypeError?new Error('تعذّر الاتصال بالخادم'):e);
    });
}
function doLogout(expired){
  try{fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({m:'logout'})}).catch(()=>{})}catch(e){}
  token='';me=null;isOwner=false;isAdmin=false;serverVer=null;orders=[];purchases=[];staffSrv=[];
  lsSet('po_token','');loginErr=expired?'انتهت الجلسة. سجّل الدخول من جديد':'';
  closeModal();render();
}
async function doLogin(){
  const name=($('#lg_name')||{}).value||'',pin=($('#lg_pin')||{}).value||'';
  loginErr='';
  try{
    const r=await call('login',{name,pin});
    token=r.token;lsSet('po_token',token);me=r.me;curUser=me.name;booting=true;render();
    await syncNow(true);
  }catch(e){loginErr=e.message;booting=false;render()}
}

/* ============ التخزين ============ */
function replaceOrder(o){
  const i=orders.findIndex(x=>x.id===o.id);if(i>=0)orders[i]=o;else orders.push(o);
  render();refreshModal(true);
}
function persist(o){
  o.updatedAt=Date.now();
  const i=orders.findIndex(x=>x.id===o.id);if(i>=0)orders[i]=o;else orders.push(o);
  dirty.add(o.id);render();refreshModal(true);
  inflight++;
  chains[o.id]=(chains[o.id]||Promise.resolve()).then(async()=>{
    if(!dirty.has(o.id))return;
    dirty.delete(o.id);
    const cur=orders.find(x=>x.id===o.id);if(!cur)return;
    try{
      const r=await call('saveOrder',{order:cur});
      if(r.conflict){replaceOrder(r.order);toast('هذا الأوردر اتعدّل من شخص آخر قبل ما تحفظ — راجع البيانات وأعد المحاولة')}
      else if(dirty.has(o.id)){const c2=orders.find(x=>x.id===o.id);if(c2){c2.rev=r.order.rev;c2.code=r.order.code;c2.createdAt=r.order.createdAt}}
      else replaceOrder(r.order);
    }catch(e){toast('تعذّر الحفظ: '+e.message);dirty.delete(o.id);syncNow(true)}
  }).finally(()=>{inflight--});
}
function mutate(id,fn){const o=orders.find(x=>x.id===id);if(!o)return;const c=clone(o);fn(c);persist(c)}
function hist(o,text){(o.history=o.history||[]).push({at:Date.now(),by:curUser||'موظف',text})}
function saveSettings(){call('saveSettings',{settings}).then(()=>{serverVer=null}).catch(e=>toast('تعذّر حفظ الإعدادات: '+e.message))}
async function syncNow(force){
  if(!token)return;
  if(!force&&(dirty.size||inflight))return;
  try{
    const r=await call('sync',{ver:force?null:serverVer,role:me&&me.role});
    me=r.me;isOwner=me.role==='owner';isAdmin=isOwner||me.role==='admin';curUser=me.name;
    if(!r.same&&!(dirty.size||inflight)){
      serverVer=r.ver;orders=r.orders;settings=normSettings(r.settings||{});designersSrv=r.designers||[];if(r.cfg)maxUploadMB=r.cfg.maxUploadMB;
      if(r.purchases)purchases=r.purchases;
      if(r.staff)staffSrv=r.staff;

      booting=false;render();refreshModal(false);refreshStaff();
    }else{booting=false;if(!r.same)serverVer=null;render()}
  }catch(e){

}

/* ============ منطق الأوردر ============ */
function totals(o){
  const sub=(o.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price),0);
  const total=Math.max(0,sub-num(o.discount)+num(o.shipCost));
  const req=Math.round(total*num(o.depositPct)/100);
  const dep=o.deposit&&o.deposit.verified?num(o.deposit.amount):0;
  const fin=o.final?num(o.final.amount):0;
  const paid=dep+fin;
  return {sub,total,req,dep,fin,paid,balance:total-paid};
}
const isOpen=o=>o.stage!=='done'&&o.stage!=='cancelled';
function flags(o){
  const f=[];if(!isOpen(o))return f;const now=Date.now();
  if(o.deliveryDate&&new Date(o.deliveryDate+'T23:59:59')<now)f.push(['bad','متأخر عن موعد التسليم']);
  const d=(now-(o.stageAt||o.createdAt||now))/864e5;
  if(d>=3)f.push(['warn','واقف '+Math.floor(d)+' أيام في المرحلة']);
  return f;
}
function blockers(o){
  const b=[],t=totals(o);
  switch(o.stage){
    case 'review':if(!o.approval)b.push('سجّل موافقة العميل على البروفة أولًا');break;
    case 'deposit':if(!(o.deposit&&o.deposit.verified))b.push('أكّد وصول العربون في الحساب أولًا');break;
    case 'production':if(o.delivery==='ship'&&!String(o.address||'').trim())b.push('عنوان الشحن ناقص — عدّل بيانات الأوردر');break;
    case 'ready':if(t.balance>0.5)b.push('المتبقي '+money(t.balance)+' لم يُحصَّل بعد');break;
  }
  return b;
}
const codeNum=o=>String(o.code||'').replace(/\D/g,'')||'0000';
const invNo=o=>'INV-'+codeNum(o), jobNo=o=>'JO-'+codeNum(o);
function nextCode(){const m=orders.reduce((a,o)=>Math.max(a,parseInt(codeNum(o),10)||0),0);return 'PO-'+String(m+1).padStart(4,'0')}
const itemsSummary=o=>(o.items||[]).map(i=>(i.qty?i.qty+'× ':'')+i.desc).join('، ');

function filtered(){
  const q=ui.q.trim().toLowerCase();

}

function renderStats(){
  const open=orders.filter(isOpen);
  const dep=orders.filter(o=>o.stage==='deposit');
  const prod=orders.filter(o=>o.stage==='production');
  const rdy=orders.filter(o=>o.stage==='ready');
  const late=open.filter(o=>flags(o).some(f=>f[0]==='bad'));
  const coll=orders.filter(o=>o.stage==='production'||o.stage==='ready').reduce((a,o)=>a+Math.max(0,totals(o).balance),0);
  const now=new Date();
  const mSales=orders.filter(o=>o.stage==='done'&&o.doneAt&&new Date(o.doneAt).getMonth()===now.getMonth()&&new Date(o.doneAt).getFullYear()===now.getFullYear()).reduce((a,o)=>a+totals(o).total,0);
  const S=(n,l,s,c)=>`<div class="stat ${c||''}"><div class="n">${n}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  $('#stats').innerHTML=S(open.length,'أوردرات مفتوحة','')
    +S(dep.length,'منتظر عربون',money(dep.reduce((a,o)=>a+totals(o).req,0))+' عرابين مطلوبة')
    +S(prod.length,'تحت التنفيذ','')
    +S(rdy.length,'جاهز للتسليم','')
    +S(money(coll),'مبالغ متبقية للتحصيل','على أوردرات التنفيذ والجاهزة')
    +S(late.length,'متأخرة','عن موعد التسليم',late.length?'bad':'')
    +S(money(mSales),'مبيعات الشهر (المسلّمة)','');
}

        <label class="f">طريقة التحويل<select id="depMethod">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>
        <label class="f">رقم العملية / اسم المحوِّل<input id="depRef"></label>
        <label class="chk"><input type="checkbox" id="depOk"><span>تأكدت من وصول المبلغ فعليًا في الحساب أو التطبيق (مش من سكرين الصورة بس)</span></label>
        <div class="row-btns"><button class="btn pri" data-act="confirmdep" data-id="${id}">تأكيد العربون</button></div>`;
      break}
    case 'production':
      h=`<b>الخطوة الحالية: التنفيذ</b> — أمر التشغيل ${jobNo(o)} صدر ${fmt(o.jobAt)}
      <div style="font-size:13px;color:var(--muted);margin:4px 0">أمر التشغيل بيتولّد تلقائيًا من الفاتورة والبروفة المعتمدة، افتحه من زر «أمر التشغيل» بالأعلى للطباعة.</div>${adv('انتهى التنفيذ وجاهز للتسليم ←')}`;break;
    case 'ready':
      h=`<b>الخطوة الحالية: ${o.delivery==='ship'?'تسليم للشحن':'إبلاغ العميل بالاستلام'} وتحصيل المتبقي</b>
      <div style="font-size:13px;margin:4px 0">المتبقي: <b>${money(Math.max(0,t.balance))}</b></div>`;
      if(t.balance>0.5)h+=`<div class="grid2"><label class="f">المبلغ المحصَّل<input id="finAmt" type="number" min="0" step="any" value="${Math.max(0,t.balance)}"></label>
        <label class="f">طريقة الدفع<select id="finMethod">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>
        <div class="row-btns"><button class="btn pri" data-act="payfinal" data-id="${id}">تسجيل التحصيل</button></div>`;
      else h+=`<div class="chk note-ok">✓ تم تحصيل كامل المبلغ</div>`;
      h+=adv('تم التسليم للعميل ✓');break;
    case 'done':
      h=`<div class="note-ok">✓ تم تسليم الأوردر ${fmt(o.doneAt)}</div>`;break;
  }
  return `<div class="sec stagebox">${h}</div>`;
}

function readItems(){return [...document.querySelectorAll('#items .irow')].map(r=>({desc:r.querySelector('.i-desc').value.trim(),specs:r.querySelector('.i-specs').value.trim(),qty:r.querySelector('.i-qty').value,price:r.querySelector('.i-price').value})).filter(i=>i.desc)}

  const el=$('#f_tot');if(!el)return;
  const o={items:readItems(),discount:$('#f_disc').value,shipCost:$('#f_del').value==='ship'?$('#f_ship').value:0,depositPct:$('#f_pct').value};
  const t=totals(o);el.textContent='الإجمالي: '+money(t.total)+' — العربون المطلوب: '+money(t.req);

function saveOrder(id){
  const name=$('#f_name').value.trim(),phone=$('#f_phone').value.trim(),items=readItems();
  if(!name||!phone){toast('اسم العميل والموبايل مطلوبين');return}
  if(!items.length){toast('أضف بندًا واحدًا على الأقل');return}
  const ship=$('#f_del').value==='ship';
  if(ship&&!$('#f_addr').value.trim()){toast('اكتب عنوان الشحن');return}
  const apply=o=>{
    o.customer={name,phone};o.source=$('#f_src').value;o.sales=$('#f_sales').value.trim();o.items=items;
    o.delivery=$('#f_del').value;o.deliveryDate=$('#f_date').value;o.address=$('#f_addr').value.trim();
    o.shipCost=ship?num($('#f_ship').value):0;o.discount=num($('#f_disc').value);o.depositPct=num($('#f_pct').value);
    o.designer=$('#f_dsg').value;o.notes=$('#f_notes').value.trim();
  };
  if(id){
    const cur=orders.find(x=>x.id===id);
    const go=()=>{mutate(id,o=>{apply(o);hist(o,'تم تعديل بيانات الأوردر'+(SIDX[o.stage]>=SIDX.production?' (أثناء التنفيذ — بلّغ المطبعة)':''))});openOrder(id);toast('تم الحفظ')};
    if(SIDX[cur.stage]>=SIDX.production)ask('الأوردر في مرحلة التنفيذ. تعديل التفاصيل لازم يتبلّغ لمسؤول المطبعة. تكمّل؟','تعديل').then(ok=>ok&&go());
    else go();
  }else{
    const mats=readMatLines('#mats'),bad=checkMats(mats);
    if(bad){toast(bad);return}
    const o={id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),code:nextCode(),stage:'new',createdAt:Date.now(),stageAt:Date.now(),history:[],materials:[],newMaterials:mats};
    apply(o);hist(o,'تم إنشاء الأوردر');persist(o);openOrder(o.id);toast('تم إنشاء '+o.code);
    if(mats.length)(chains[o.id]||Promise.resolve()).then(()=>syncNow(true));
  }
}

/* ============ الأدوار والموظفين وواجهة المصمم ============ */
const ROLES={
  owner:{t:'المالك',lite:false,adv:'all',create:1,edit:1,settings:1,docs:['inv','job']},
  admin:{t:'مدير',lite:false,adv:'all',create:1,edit:1,settings:1,docs:['inv','job']},
  sales:{t:'سيلز',lite:false,adv:['new','proof','review','deposit','ready'],create:1,edit:1,docs:['inv','job']},
  designer:{t:'مصمم',lite:true,adv:[],view:['proof','review'],docs:[]},
  production:{t:'مسؤول تشغيل',lite:true,adv:['production'],view:['production','ready'],docs:['job']}
};
const ROLE_HELP={
  admin:'كل شيء في الأوردرات والإعدادات (بدون المشتريات والأرباح والموظفين)',
  sales:'إنشاء الأوردرات والفواتير والعرابين والتحصيل ونقل المراحل',
  designer:'يرى الأوردرات المطلوب تصميمها فقط بدون أي أسعار، يرفع البروفات ويعلن جاهزيتها',
  production:'يرى أوامر التشغيل بدون أسعار وينقل الأوردر من التنفيذ إلى جاهز'
};
const roleKey=()=>me?me.role:null;
const roleDef=()=>ROLES[roleKey()]||null;
const isLite=()=>{const R=roleDef();return !!(R&&R.lite)};
const myLabel=()=>me?me.name:(curUser||'');
const designerList=()=>[...new Set(list(settings.designers).concat(designersSrv))];
const OPEN_ACTS=new Set(['open','close','closedoc','user','chpin','logout','retry','upfile','addlink','delfile','mine','print','savedoc']);
const OWNER_ACTS=new Set(['staff','newstaff','savestaff','delstaff','stockrecv','addrecvline','delrecvline','saverecv','itemedit','saveitem','adjitem','delitemstock','delstockp','newitem']);
const SETTINGS_ACTS=new Set(['settings','savesettings','addpage','delpage','pickLogo','clearLogo']);
const FIN_ACTS=new Set(['newp','editp','savep','delp']);
function allowed(a,el){
  const rk=roleKey();
  if(!rk)return a==='login'||a==='retry';
  const R=ROLES[rk];
  if(OWNER_ACTS.has(a))return rk==='owner';
  if(FIN_ACTS.has(a))return isFin();
  if(SETTINGS_ACTS.has(a))return !!R.settings;
  if(a==='doc')return R.docs.includes(el.dataset.t);
  if(a==='advance'){const o=orders.find(x=>x.id===el.dataset.id);return !!o&&(R.adv==='all'||R.adv.includes(o.stage))}
  if(a==='proofready'||a==='takeover')return rk!=='production';
  if(OPEN_ACTS.has(a))return true;
  return !R.lite;
}

function detailLite(o){

let stockItems=[],stockLog=[];

function stockHTML(){
  const q=ui.q.trim().toLowerCase(),own=isOwner;

  const low=stockItems.filter(isLow).length;
  const S=(n,l,c)=>`<div class="stat ${c||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const rows=L.map(i=>`<tr class="row ${isLow(i)?'lowrow':''}" ${own?`data-act="itemedit" data-id="${esc(i.id)}"`:''}><td><b>${esc(i.name)}</b></td><td>${esc(i.unit)}</td><td><b>${qtyFmt(i.qty)}</b> ${isLow(i)?'<span class="badge warn">تحت الحد الأدنى</span>':''}</td>${own?`<td>${money(i.avgCost)}</td><td>${money(num(i.qty)*num(i.avgCost))}</td>`:''}<td>${num(i.minQty)?qtyFmt(i.minQty):'—'}</td></tr>`).join('');
  const moves=own&&stockLog.length?`<details class="rep" style="margin-top:10px"><summary>سجل حركات المخزن (آخر ${Math.min(100,stockLog.length)})</summary><div class="lstwrap" style="margin-top:8px"><table class="lst"><thead><tr><th>التاريخ</th><th>الصنف</th><th>النوع</th><th>الكمية</th><th>التكلفة</th><th>الأوردر</th><th>بواسطة</th></tr></thead><tbody>${stockLog.slice(0,100).map(m=>{const it=itemById(m.itemId),o=orders.find(x=>x.id===m.orderId);return `<tr><td>${fmt(m.at)}</td><td>${esc(it?it.name:'(محذوف)')}</td><td>${MOVE_T[m.type]||esc(m.type)}${m.note&&m.type==='adjust'?' · '+esc(m.note):''}</td><td>${m.qty>0?'+':''}${qtyFmt(m.qty)}</td><td>${money(m.unitCost)}</td><td>${o?esc(o.code):'—'}</td><td>${esc(m.by||'')}</td></tr>`}).join('')}</tbody></table></div></details>`:'';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">${own?'<button class="btn pri" data-act="stockrecv">+ توريد مشتريات للمخزن</button><button class="btn" data-act="newitem">+ صنف جديد</button>':''}</div>
  <div class="stats">${S(stockItems.length,'عدد الأصناف')}${own?S(money(stockValue()),'قيمة المخزون الحالية'):''}${S(low,'أصناف تحت الحد الأدنى',low?'bad':'')}</div>
  ${L.length?`<div class="lstwrap"><table class="lst"><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية المتاحة</th>${own?'<th>متوسط التكلفة</th><th>القيمة</th>':''}<th>الحد الأدنى</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${stockItems.length?'لا توجد نتائج':'المخزن فاضي'+(own?'. اضغط «توريد مشتريات للمخزن» وأضف أصنافك بكمياتها وأسعارها.':'.')}</div>`}
  ${moves}
  <div class="empty" style="text-align:start">💡 لما تفتح أوردر جديد هتلاقي قسم «الخامات المستخدمة»: اختر لكل خامة <b>سحب من المخزن</b> أو <b>مشتريات خارجية</b>.${own?'':' (التكاليف يراها المالك فقط)'}</div>`;

const readRecv=()=>[...document.querySelectorAll('#rlines .rrow')].map(r=>({name:r.querySelector('.r-name').value.trim(),unit:r.querySelector('.r-unit').value.trim(),qty:r.querySelector('.r-qty').value,price:r.querySelector('.r-price').value})).filter(l=>l.name||l.qty||l.price);

}

function readMatLines(sel){
  return [...document.querySelectorAll(sel+' .mrow')].map(r=>{
    const src=r.querySelector('.m-src').value,qty=num(r.querySelector('.m-qty').value);
    return src==='stock'?{source:'stock',itemId:r.querySelector('.m-item').value,qty}:{source:'external',name:r.querySelector('.m-name').value.trim(),qty,cost:num(r.querySelector('.m-cost').value)};
  }).filter(l=>l.source==='stock'?(l.itemId||l.qty):l.name);
}
function checkMats(lines){
  const need={};
  for(const l of lines){
    if(l.source==='stock'){if(!l.itemId)return 'اختر صنف المخزن أو احذف السطر';if(!(l.qty>0))return 'اكتب كمية السحب';need[l.itemId]=(need[l.itemId]||0)+l.qty}
    else if(!l.name)return 'اكتب وصف المشتريات الخارجية';
  }
  for(const id in need){const it=itemById(id);if(!it||need[id]>num(it.qty)+1e-9)return 'الكمية المتاحة من «'+(it?it.name:'؟')+'» هي '+(it?qtyFmt(it.qty)+' '+it.unit:'0')+' فقط'}
  return '';
}
function matsHTML(o){
  const ms=o.materials||[],open=o.stage!=='done'&&o.stage!=='cancelled';
  return `<div class="sec"><h4>🧱 الخامات المستخدمة</h4>
  ${ms.length?`<div style="overflow-x:auto"><table class="items-t"><thead><tr><th>الخامة</th><th>المصدر</th><th>الكمية</th>${isOwner?'<th>التكلفة</th>':''}<th></th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.source==='stock'?'<span class="badge">من المخزن</span>':'<span class="badge warn">مشتريات خارجية</span>'}${m.status==='returned'?' <span class="badge bad">مُرجَعة</span>':''}</td><td>${m.qty?qtyFmt(m.qty)+' '+esc(m.unit||''):'—'}</td>${isOwner?`<td>${m.source==='stock'?(m.status==='returned'?'—':money(num(m.qty)*num(m.unitCost))):(m.purchaseId?'مسجّلة في المشتريات':'—')}</td>`:''}<td>${m.source==='stock'&&m.status!=='returned'&&o.stage!=='done'?`<button class="btn sm" data-act="retmat" data-id="${o.id}" data-m="${esc(m.id)}">إرجاع للمخزن</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="text-align:start">لم تُسجَّل خامات لهذا الأوردر</div>'}

/* ---- الفترات ---- */
function periodRange(v){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),ms=(yy,mm)=>new Date(yy,mm,1).getTime();
  if(v==='thisMonth')return [ms(y,m),ms(y,m+1)];
  if(v==='lastMonth')return [ms(y,m-1),ms(y,m)];
  if(v==='last3')return [ms(y,m-2),ms(y,m+1)];
  if(v==='thisYear')return [ms(y,0),ms(y+1,0)];
  if(/^m:\d{4}-\d{2}$/.test(v||'')){const [a,b]=v.slice(2).split('-').map(Number);return [ms(a,b-1),ms(a,b)]}
  return [0,Infinity];
}
function periodSelect(){
  const now=new Date();
  const base=[['thisMonth','هذا الشهر'],['lastMonth','الشهر الماضي'],['last3','آخر 3 شهور'],['thisYear','هذه السنة'],['all','كل الفترات']];
  const ms=[];for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(['m:'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),d.toLocaleDateString('ar-EG-u-nu-latn',{month:'long',year:'numeric'})])}
  return `<select id="period" class="inp" style="width:auto;display:inline-block;margin:0">${base.concat(ms).map(o=>`<option value="${o[0]}" ${ui.period===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
}

  const i=purchases.findIndex(x=>x.id===p.id);if(i>=0)purchases[i]=p;else purchases.push(p);
  render();
  call('savePurchase',{p}).then(()=>{serverVer=null}).catch(e=>{toast('تعذّر حفظ المشترى: '+e.message);syncNow(true)});
}
function deleteP(id){
  purchases=purchases.filter(x=>x.id!==id);render();

}

/* ---- الإحصائيات ---- */
function finStats(from,to){
  const inR=t=>t>=from&&t<to;
  const dOrders=orders.filter(o=>o.stage==='done'&&o.doneAt&&inR(o.doneAt));
  const ids=new Set(dOrders.map(o=>o.id));
  const revenue=dOrders.reduce((a,o)=>a+totals(o).total,0);
  const direct=purchases.filter(p=>p.orderId&&ids.has(p.orderId)).reduce((a,p)=>a+num(p.total),0)+dOrders.reduce((a,o)=>a+matCost(o),0);
  const general=purchases.filter(p=>!p.orderId&&!p.stock&&inR(pts(p))).reduce((a,p)=>a+num(p.total),0);
  const inP=purchases.filter(p=>inR(pts(p)));
  const cashOut=inP.reduce((a,p)=>a+paidOf(p),0);
  const cashIn=orders.reduce((a,o)=>a+(o.deposit&&o.deposit.verified&&inR(o.deposit.at)?num(o.deposit.amount):0)+(o.final&&inR(o.final.at)?num(o.final.amount):0),0);
  return {dOrders,revenue,direct,gross:revenue-direct,general,net:revenue-direct-general,cashIn,cashOut};
}
function barsHTML(obj,limit){
  const rows=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit||99);
  if(!rows.length)return '<div class="empty">لا توجد بيانات</div>';
  const max=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(r=>`<div class="hb"><span>${esc(r[0])}</span><div class="bt"><i style="width:${(r[1]/max*100).toFixed(1)}%"></i></div><b>${money(r[1])}</b></div>`).join('');
}
function trendHTML(){
  const now=new Date(),cols=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const s=finStats(d.getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime());cols.push({l:d.toLocaleDateString('ar-EG-u-nu-latn',{month:'short'}),rev:s.revenue,cost:s.direct+s.general,net:s.net})}
  const max=Math.max(1,...cols.map(c=>Math.max(c.rev,c.cost)));
  return `<div class="trend">${cols.map(c=>`<div class="tcol"><div class="tbars"><i class="r" style="height:${(c.rev/max*100).toFixed(1)}%" title="إيراد"></i><i class="c" style="height:${(c.cost/max*100).toFixed(1)}%" title="تكلفة"></i></div><div class="tl">${c.l}</div><div class="tn ${c.net<0?'neg':'pos'}">${sh(c.net)}</div></div>`).join('')}</div>
  <div class="empty" style="padding:6px 0 0"><span style="color:var(--brand)">■</span> إيراد (أوردرات مسلّمة) &nbsp; <span style="color:var(--warn)">■</span> تكلفة ومصروفات &nbsp; والرقم تحت كل شهر = صافي الربح</div>`;
}

    ${C(money(s.gross),'مجمل الربح','هامش '+margin.toFixed(0)+'%',s.gross<0?'bad':'ok')}
    ${C(money(s.general),'مصروفات عامة','مشتريات غير مربوطة بأوردر')}
    ${C(money(s.net),'صافي الربح','',s.net<0?'bad':'ok')}
  </div>
  <div class="stats">
    ${C(money(s.cashIn),'نقدية داخلة','عرابين وتحصيلات')}
    ${C(money(s.cashOut),'نقدية خارجة','مدفوعات المشتريات')}

    ${C(money(recv),'مطلوب من العملاء','أوردرات تنفيذ وجاهزة')}

function fileToLogo(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    let max=240;
    for(let k=0;k<6;k++){
      const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let u=c.toDataURL('image/png');if(u.length>60000)u=c.toDataURL('image/webp',0.85);
      if(u.length<=60000){res(u);return}
      max=Math.round(max*0.72);
    }
    rej(new Error('big'));
  };img.onerror=rej;img.src=fr.result};
  fr.onerror=rej;fr.readAsDataURL(file);
})}

async function advance(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const next=STAGES[SIDX[o.stage]+1];if(!next)return;
  const bl=blockers(o);if(bl.length){toast(bl[0]);return}
  const patch={};
  if(o.stage==='new'){const d=$('#dsg');if(d&&d.value)patch.designer=d.value}
  if(o.stage==='proof'){const p=$('#proofRef');if(p)patch.proofRef=p.value.trim()}
  if(o.stage==='deposit'){const t=totals(o);if(t.dep<t.req&&!await ask('العربون المؤكد '+money(t.dep)+' أقل من المطلوب '+money(t.req)+'. تبدأ التنفيذ؟','ابدأ التنفيذ'))return}
  mutate(id,x=>{
    Object.assign(x,patch);x.stage=next.k;x.stageAt=Date.now();
    if(next.k==='deposit'){x.invoiceAt=Date.now();hist(x,'تم إصدار الفاتورة المبدئية '+invNo(x))}
    if(next.k==='production'){x.jobAt=Date.now();hist(x,'تم إصدار أمر التشغيل '+jobNo(x))}
    if(next.k==='done'){x.doneAt=Date.now()}
    hist(x,'انتقل الأوردر إلى: '+next.t);
  });
  toast('تم النقل إلى: '+next.t);
}

    case 'addrecvline':$('#rlines').insertAdjacentHTML('beforeend',recvRow());break;
    case 'delrecvline':{const rows=document.querySelectorAll('#rlines .rrow');if(rows.length>1){el.closest('.rrow').remove();calcRecv()}break}
    case 'saverecv':saveReceive();break;
    case 'newitem':openItemEdit('');break;
    case 'itemedit':openItemEdit(id);break;
    case 'saveitem':saveItem(id);break;
    case 'adjitem':adjustItem(id);break;
    case 'delitemstock':ask('حذف الصنف من المخزن؟','حذف').then(ok=>ok&&call('stockItemDelete',{id}).then(()=>syncNow(true)).then(()=>{closeModal();toast('تم الحذف')}).catch(e=>toast(e.message)));break;
    case 'delstockp':ask('حذف هذا التوريد وخصم كمياته من المخزن؟','حذف').then(ok=>ok&&call('stockPurchaseDelete',{id}).then(()=>syncNow(true)).then(()=>{closeModal();toast('تم حذف التوريد')}).catch(e=>toast(e.message)));break;
    case 'addmatline':$('#mats').insertAdjacentHTML('beforeend',matRow());break;
    case 'delmatline':el.closest('.mrow').remove();break;
    case 'addmat':openMatModal(id);break;
    case 'savemat':saveMat(id);break;
    case 'retmat':ask('إرجاع هذه الخامة للمخزن؟','إرجاع').then(ok=>ok&&call('materialReturn',{orderId:id,lineId:el.dataset.m}).then(r=>{replaceOrder(r.order);syncNow(true);toast('تم الإرجاع للمخزن')}).catch(e=>toast(e.message)));break;
    case 'export':exportCSV(ui.tab);break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){e.preventDefault();act(el.dataset.act,el);return}
  if(e.target===$('#modal'))closeModal();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;render();return}
  if(e.target.closest('#items')||['f_disc','f_ship','f_pct','f_del'].includes(e.target.id))calcForm();
  if(e.target.closest('#rlines'))calcRecv();
});
document.addEventListener('change',e=>{
  if(e.target.id==='f_del')calcForm();
  if(e.target.classList&&e.target.classList.contains('r-name'))autoUnit(e.target);
  if(e.target.classList&&e.target.classList.contains('m-src')){const r=e.target.closest('.mrow'),ext=e.target.value==='external';r.querySelector('.m-item').style.display=ext?'none':'';r.querySelector('.m-name').style.display=ext?'':'none';r.querySelector('.m-cost').style.visibility=ext?'visible':'hidden'}
  if(e.target.id==='period'){ui.period=e.target.value;render()}
  if(e.target.id==='lgf')handleLogo(e.target);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lg_pin'||e.target.id==='lg_name'))doLogin()});
init();
</script>
</body>
</html>
